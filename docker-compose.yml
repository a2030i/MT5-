version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: mursheed-db
    environment:
      POSTGRES_USER: mursheed
      POSTGRES_PASSWORD: mursheed
      POSTGRES_DB: mursheed
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mursheed"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mursheed-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  backend:
    build: ./backend
    container_name: mursheed-backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://mursheed:mursheed@db:5432/mursheed
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: mursheed-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
